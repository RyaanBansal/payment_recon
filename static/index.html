<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment - Zoho Reconciliation</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#dfe3e8; --text:#1c2430; --muted:#66707d; --accent:#2457d6; --accent-d:#1b44a8;
          --ok:#137a3d; --ok-bg:#e0f5e8; --warn:#9a5b00; --warn-bg:#fff0d4; --bad:#b3261e; --bad-bg:#fde4e2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 24px; background:#101828; color:#fff; font-size:17px; font-weight:600; }
  main { padding:18px 24px 40px; max-width:1800px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #card-payments h2 {margin-bottom: 24px;} #card-monthly h2 { margin-bottom: 10px; }

  /* upload segment: a single box, a dropdown picks which sheet the files are for */
  .uploads { display:grid; gap:16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .upload-actions { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:16px; margin-top:16px; }
  .upload-actions .reconcile-btn { justify-self:start; width:auto; min-width:220px; margin-top:6px; }
  .sheetpick { display:flex; flex-direction:row; align-items:center; gap:8px; margin:0 0 10px; color:var(--muted); max-width:420px; font:inherit; }
  .sheetpick span { font-size:14px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .sheetpick select { font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); font-size:14px; min-width:180px; }
  .status-list { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; }
  .status-list b { color:var(--text); }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:110px; border:2px dashed #b9c2cf;
          border-radius:8px; background:#fafbfc; cursor:pointer; text-align:center; padding:12px; transition:.15s; }
  .drop:hover, .drop.over { border-color:var(--accent); background:#eef3ff; }
  .drop input { display:none; }
  .drop .fname { font-weight:600; word-break:break-all; }
  .drop .hint { color:var(--muted); font-size:12.5px; }
  .msg { min-height:20px; margin-top:8px; font-size:13px; white-space:pre-line; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--bad); } .msg .w { color:var(--warn); display:block; } .msg .e { color:var(--bad); display:block; }
  .flist { list-style:none; margin:10px 0 0; padding:0; max-height:170px; overflow:auto; }
  .flist:empty { display:none; }
  .flist li { display:flex; align-items:center; gap:8px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; margin-bottom:4px; font-size:13px; }
  .flist .fn { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flist .fs { color:var(--muted); font-size:12px; }
  .flist .rm { border:none; background:none; color:var(--muted); padding:0 4px; font-size:18px; line-height:1; }
  .flist .rm:hover { color:var(--bad); }
  .meta { color:var(--muted); font-size:12.5px; margin-top:4px; }

  button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line); background:#fff; padding:7px 14px; }
  button:hover:not(:disabled) { border-color:#aab3c0; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover:not(:disabled) { background:var(--accent-d); border-color:var(--accent-d); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.danger { color:#b42318; border-color:#f1b5b0; margin-left:auto; }
  button.danger:hover:not(:disabled) { background:#fef3f2; border-color:#b42318; }
  .upbtn { width:100%; margin-top:0; }

  .matchbar { margin:16px 0; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .matchbar .big { padding:10px 34px; font-size:15px; }
  .matchbar label { display:flex; gap:6px; align-items:center; color:var(--muted); cursor:pointer; }
  .banner { padding:8px 12px; border-radius:7px; background:var(--warn-bg); color:var(--warn); font-size:13px; }

  .tabs { display:flex; gap:4px; border-bottom:2px solid var(--line); overflow-x:auto; }
  .tab { border:none; background:none; padding:10px 18px; border-radius:8px 8px 0 0; font-weight:600; color:var(--muted); margin-bottom:-2px; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); background:#fff; }
  .panel { display:none; background:#fff; border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; padding:14px; }
  .panel.active { display:block; }
  .subtabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .subtab { padding:6px 16px; border-radius:999px; font-weight:600; color:var(--muted); }
  .subtab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .subpanel { display:none; } .subpanel.active { display:block; }
  .selwrap { display:contents; }

  .filters { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin-bottom:12px; }
  .filters label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  .filters select, .filters input { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; min-width:130px; background:#fff; color:var(--text); }
  .filters input.date { width:120px; min-width:0; }
  .filters input.bad { border-color:var(--bad); background:var(--bad-bg); }
  .chips { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width:100%; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .chip { display:flex; align-items:center; justify-content:center; padding:12px 10px; border-radius:0; border:none; font-size:14px; font-weight:700; background:#f3f5f8; color:var(--text); }
  .chip + .chip { border-left:1px solid var(--line); }
  .chip[data-r="All"] { background:#eaf2ff; color:#1d4ed8; }
  .chip[data-r="Matched"] { background:#eafaf1; color:#137a3d; }
  .chip[data-r="Mismatched"] { background:#fff6d9; color:#9a5b00; }
  .chip[data-r="Missing"] { background:#fde8e8; color:#b3261e; }
  .chip.active[data-r="All"] { background:#2457d6; color:#fff; }
  .chip.active[data-r="Matched"] { background:#137a3d; color:#fff; }
  .chip.active[data-r="Mismatched"] { background:#c78a00; color:#fff; }
  .chip.active[data-r="Missing"] { background:#b3261e; color:#fff; }
  .result-top { margin-bottom:12px; }
  .err-line { color:var(--bad); font-size:12.5px; margin-bottom:8px; }

  .tablewrap { overflow:auto; max-height:62vh; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:13px; }
  th, td { padding:6px 10px; border-bottom:1px solid #edf0f3; white-space:nowrap; text-align:left; max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  th { position:sticky; top:0; background:#f0f3f7; z-index:2; font-weight:600; border-bottom:1px solid var(--line); }
  tr:hover td { background:#fafcff; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-weight:600; font-size:12px; }
  .b-Matched { background:var(--ok-bg); color:var(--ok); } .b-Mismatched { background:var(--warn-bg); color:var(--warn); } .b-Missing { background:var(--bad-bg); color:var(--bad); }
  td select, td input { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  td input.remarks { width:220px; }
  td.saved select, td.saved input { border-color:#7cc99a; }
  th.added { background:#e6edff; }
  .pager { display:flex; align-items:center; gap:10px; margin-top:10px; color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .diffpos { color:var(--warn); } .diffneg { color:var(--bad); }
</style>
</head>
<body>
<header>Payment &harr; Zoho Reconciliation</header>
<main>

  <nav class="tabs">
    <button class="tab active" data-tab="upload">Upload</button>
    <button class="tab" data-tab="results">Results</button>
    <button class="tab" data-tab="zoho">Zoho sheets</button>
    <button class="tab" data-tab="razorpay">Razorpay sheets</button>
    <button class="tab" data-tab="kotak">Kotak sheets</button>
    <button class="tab" data-tab="cashfree">Cash free sheets</button>
    <button class="tab" data-tab="icici">ICICI sheets</button>
    <button class="tab" data-tab="hdfc">HDFC sheets</button>
  </nav>

  <section class="panel active" id="panel-upload">
    <div class="uploads">
      <section class="card" id="card-payments" data-upload-action="upload-zoho">
        <h2>Zoho sheet</h2>
        <label class="drop">
          <input type="file" multiple>
          <span class="fname">Click or drop the files here</span>
          <span class="hint"></span>
        </label>
        <ul class="flist"></ul>
        <div class="msg"></div>
        <div class="status-list"></div>
      </section>

      <section class="card" id="card-monthly" data-upload-action="upload-monthly">
        <h2>
          <label class="sheetpick">
            <span>Payment sheets</span>
            <select class="up-kind"></select>
          </label>
        </h2>
        <label class="drop">
          <input type="file" multiple>
          <span class="fname">Click or drop the files here</span>
          <span class="hint"></span>
        </label>
        <ul class="flist"></ul>
        <div class="msg"></div>
        <div class="status-list"></div>
      </section>
    </div>
    <div class="upload-actions">
      <button class="primary upbtn" id="upload-zoho" data-kind="payments" disabled>Upload Zoho Sheet</button>
      <button class="primary upbtn" id="upload-monthly" data-kind="monthly" disabled>Upload Monthly Sheet</button>
      <button class="primary upbtn reconcile-btn" id="matchBtn" disabled>Reconcile sheets</button>
    </div>
  </section>

  <section class="panel" id="panel-results">
    <section class="matchbar">
      <label title="Razorpay 'amount' includes the gateway fee; the customer payment sheet records the invoice amount. When ticked, Difference = Amount (INR) - Payment Amount - Fees; when unticked the fee is ignored.">
        <input type="checkbox" id="feeAdjust" checked> Subtract Razorpay fee in the difference when matching (Razorpay only)
      </label>
      <span id="matchInfo" class="meta"></span>
      <span id="stale" class="banner" hidden>Data changed since the last match - click Match to refresh.</span>
    </section>

    <div class="subtabs">
      <button class="subtab active" data-sub="razorpay">Razorpay</button>
      <button class="subtab" data-sub="kotak">Kotak</button>
      <button class="subtab" data-sub="cashfree">Cash Free</button>
      <button class="subtab" data-sub="icici">ICICI</button>
      <button class="subtab" data-sub="hdfc">HDFC</button>
    </div>
    <div class="subpanel active" id="sub-razorpay">
      <div class="result-top">
        <div class="chips" id="chips"></div>
      </div>
      <div class="filters">
        <label>Razorpay status
          <select id="m-status"></select>
        </label>
        <label>Currency
          <select id="m-currency"><option value="">All</option></select>
        </label>
        <label>Search (id / notes / description)
          <input id="m-q" placeholder="e.g. pay_Ry...">
        </label>
      </div>
      <div class="filters dl">
        <button id="download-current-view" class="primary" type="button">Download current table</button>
        <button class="danger" data-clear="matches:razorpay">Clear data</button>
      </div>
      <div id="m-table"></div>
      <div class="pager" id="m-pager"></div>
    </div>
    <div class="subpanel" id="sub-kotak"></div>
    <div class="subpanel" id="sub-cashfree"></div>
    <div class="subpanel" id="sub-icici"></div>
    <div class="subpanel" id="sub-hdfc"></div>
  </section>

  <section class="panel" id="panel-zoho">
    <div class="filters">
      <label>Mode <select id="p-mode"><option value="">All</option></select></label>
      <label>Deposit To <select id="p-dep"><option value="">All</option></select></label>
      <label>Currency <select id="p-currency"><option value="">All</option></select></label>
      <label>Date from (yyyy-mm-dd) <input class="date" id="p-from" placeholder="yyyy-mm-dd" maxlength="10"></label>
      <label>Date to (yyyy-mm-dd) <input class="date" id="p-to" placeholder="yyyy-mm-dd" maxlength="10"></label>
      <button id="p-apply">Apply</button><button id="p-reset">Reset</button>
      <button class="danger" data-clear="sheet:payments">Clear data</button>
    </div>
    <div class="err-line" id="p-err"></div>
    <div id="p-table"></div>
    <div class="pager" id="p-pager"></div>
  </section>

  <section class="panel" id="panel-razorpay">
    <div class="filters">
      <label>Method <select id="z-method"><option value="">All</option></select></label>
      <label>Currency <select id="z-currency"><option value="">All</option></select></label>
      <label>Date from (dd/mm/yyyy) <input class="date" id="z-from" placeholder="dd/mm/yyyy" maxlength="10"></label>
      <label>Date to (dd/mm/yyyy) <input class="date" id="z-to" placeholder="dd/mm/yyyy" maxlength="10"></label>
      <button id="z-apply">Apply</button><button id="z-reset">Reset</button>
      <button class="danger" data-clear="sheet:zoho">Clear data</button>
    </div>
    <div class="err-line" id="z-err"></div>
    <div id="z-table"></div>
    <div class="pager" id="z-pager"></div>
  </section>

  <section class="panel" id="panel-kotak"></section>
  <section class="panel" id="panel-cashfree"></section>
  <section class="panel" id="panel-icici"></section>
  <section class="panel" id="panel-hdfc"></section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const PAGE = 100;
const esc = v => v == null ? "" : String(v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const rate = v => Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 6 });
const money = v => v == null ? "" : Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function api(url, opts) {
  const r = await fetch(url, opts);
  let body = null; try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && body.detail) || `Request failed (${r.status})`);
  return body;
}
const qs = o => new URLSearchParams(Object.entries(o).filter(([, v]) => v !== "" && v != null)).toString();
const fmtTs = t => t ? t.replace("T", " ") : "never";

/* ---------------- upload box (one box, dropdown = which sheet) ---------------- */
/* To support another monthly sheet: add one entry to MONTHLY_UPLOADS (and the backend side) - nothing else changes.
   rows/at = the field names in /api/status. */
const ZOHO_UPLOAD = [
  { kind: "payments", label: "Zoho sheet", btn: "Upload Zoho Sheet", rows: "payments_rows", at: "payments_loaded_at", ext: /\.(xlsx|xlsm)$/i, extHint: ".xlsx", accept: ".xlsx,.xlsm",
    hint: "Full list of customer payments (.xlsx) - select one or more; they are combined, and replace the previous Zoho sheet" },
];
const MONTHLY_UPLOADS = [
  { kind: "zoho", label: "Razorpay sheet", btn: "Upload Razorpay Sheet", rows: "zoho_rows", at: "zoho_loaded_at", ext: /\.(xlsx|xlsm)$/i, extHint: ".xlsx", accept: ".xlsx,.xlsm",
    hint: "Monthly Razorpay payments (.xlsx) - select one or more" },
  { kind: "kotak", label: "Kotak sheet", btn: "Upload Kotak Sheet", rows: "kotak_rows", at: "kotak_loaded_at", ext: /\.(csv|xlsx|xlsm)$/i, extHint: ".csv or .xlsx", accept: ".csv,.xlsx,.xlsm",
    hint: "Monthly Kotak statement (.csv or .xlsx) - select one or more" },
  { kind: "cashfree", label: "Cash Free sheet", btn: "Upload Cash Free Sheet", rows: "cashfree_rows", at: "cashfree_loaded_at", ext: /\.(xlsx|xlsm)$/i, extHint: ".xlsx", accept: ".xlsx,.xlsm",
    hint: "Monthly Cash Free transactions (.xlsx) - all month tabs are read" },
  { kind: "icici", label: "ICICI sheet", btn: "Upload ICICI Sheet", rows: "icici_rows", at: "icici_loaded_at", ext: /\.(xlsx|xlsm)$/i, extHint: ".xlsx", accept: ".xlsx,.xlsm",
    hint: "ICICI account statement (.xlsx) as downloaded - select one or more" },
  { kind: "hdfc", label: "HDFC sheet", btn: "Upload HDFC Sheet", rows: "hdfc_rows", at: "hdfc_loaded_at", ext: /\.(xls|xlsx|xlsm)$/i, extHint: ".xls or .xlsx", accept: ".xls,.xlsx,.xlsm",
    hint: "HDFC account statement (.xls or .xlsx) as downloaded - select one or more" },
];
const UPLOAD_BOXES = [["#card-payments", ZOHO_UPLOAD], ["#card-monthly", MONTHLY_UPLOADS]];
function setupUploadBox(cardSel, UPLOADS) {
  const card = $(cardSel), pick = $(".up-kind", card) || { value: UPLOADS[0].kind, set onchange(f) {}, disabled: false }, input = $("input", card), drop = $(".drop", card), btn = document.getElementById(card.dataset.uploadAction), msg = $(".msg", card), list = $(".flist", card);
  const pending = {}, notes = {};  // per sheet type: files chosen but not uploaded yet, and the last message - switching the dropdown never mixes them up
  UPLOADS.forEach(u => { pending[u.kind] = []; notes[u.kind] = { cls: "msg", html: "" }; });
  if (pick.tagName) pick.innerHTML = UPLOADS.map(u => `<option value="${u.kind}">${esc(u.label)}</option>`).join("");
  const cur = () => UPLOADS.find(u => u.kind === pick.value);
  const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const say = (u, cls, html) => { notes[u.kind] = { cls, html }; if (u === cur()) { msg.className = cls; msg.innerHTML = html; } };
  const render = () => {
    const u = cur(), files = pending[u.kind];
    input.accept = u.accept;
    $(".hint", drop).textContent = u.hint;
    list.innerHTML = files.map((f, i) => `<li><span class="fn" title="${esc(f.name)}">${esc(f.name)}</span><span class="fs">${kb(f.size)}</span><button type="button" class="rm" data-i="${i}" title="Remove">&times;</button></li>`).join("");
    $(".fname", drop).textContent = files.length ? `${files.length} file${files.length > 1 ? "s" : ""} selected - click or drop to add more` : "Click or drop the files here";
    if (btn) {
      const label = files.length > 1 ? `${u.btn} (${files.length} files)` : u.btn;
      btn.textContent = label;
      btn.disabled = !files.length;
    }
    msg.className = notes[u.kind].cls; msg.innerHTML = notes[u.kind].html;
  };
  const add = picked => {
    const u = cur(), files = pending[u.kind], skipped = [];
    for (const f of picked) {
      if (!u.ext.test(f.name)) { skipped.push(f.name); continue; }
      if (!files.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) files.push(f);
    }
    say(u, skipped.length ? "msg err" : "msg", skipped.length ? esc(`Skipped (not a ${u.extHint} file): ${skipped.join(", ")}`) : "");
    render();
  };
  pick.onchange = render;
  document.addEventListener("sheet-cleared", e => { if (notes[e.detail]) { notes[e.detail] = { cls: "msg", html: "" }; render(); } });  // its old "Loaded ..." message no longer holds
  input.onchange = () => { add([...input.files]); input.value = ""; };
  list.onclick = e => { const b = e.target.closest(".rm"); if (b) { pending[cur().kind].splice(+b.dataset.i, 1); say(cur(), "msg", ""); render(); } };
  ["dragover", "dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, () => drop.classList.remove("over")));
  drop.addEventListener("drop", ev => { ev.preventDefault(); add([...ev.dataTransfer.files]); });
  if (btn) btn.onclick = async () => {
    const u = cur(), files = pending[u.kind];
    if (!files.length) return;
    pick.disabled = true; btn.disabled = true; btn.textContent = "Uploading..."; say(u, "msg", "");
    try {
      const fd = new FormData(); files.forEach(f => fd.append("files", f));  // all selected files go up in one request
      const res = await api("/api/upload/" + u.kind, { method: "POST", body: fd });
      const failed = (res.results || []).filter(r => !r.ok);
      say(u, failed.length ? "msg err" : "msg ok", esc(res.message) + failed.map(r => `<span class="e">&#10007; ${esc(r.filename)}: ${esc(r.message)}</span>`).join("") +
        (res.warnings || []).map(w => `<span class="w">&#9888; ${esc(w)}</span>`).join(""));
      const bad = new Set(failed.map(r => r.filename));
      pending[u.kind] = files.filter(f => bad.has(f.name));  // uploaded files leave the list; failed ones stay so they can be fixed/removed
      await refreshStatus(); reloadAll();
    } catch (e) { say(u, "msg err", esc(e.message)); }
    pick.disabled = false; render();
  };
  render();
}
UPLOAD_BOXES.forEach(([sel, items]) => setupUploadBox(sel, items));

/* ---------------- status + match ---------------- */
async function refreshStatus() {
  const s = await api("/api/status");
  for (const [sel, items] of UPLOAD_BOXES) $(".status-list", $(sel)).innerHTML = items.map(u => `<span><b>${esc(u.label)}:</b> ${s[u.rows] ? `${s[u.rows].toLocaleString()} rows (loaded ${esc(fmtTs(s[u.at]))})` : "nothing uploaded yet"}</span>`).join("");
  $("#matchBtn").disabled = !(s.payments_rows && MONTHLY_UPLOADS.some(u => s[u.rows]));
  $("#matchInfo").textContent = s.matched_at ? `Last matched: ${fmtTs(s.matched_at)}` : "";
  $("#stale").hidden = !s.stale;
  $("#feeAdjust").checked = s.fee_adjust;
}
$("#matchBtn").onclick = async () => {
  const b = $("#matchBtn"); b.disabled = true; b.textContent = "Matching...";
  try {
    await api("/api/match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fee_adjust: $("#feeAdjust").checked }) });
    activate("results"); mState.page = 1; Object.values(srcMatch).forEach(m => m.page = 1); await loadSub[curSub]();
  } catch (e) { alert(e.message); }
  b.textContent = "Match"; await refreshStatus();
};

/* ---------------- tabs ---------------- */
function activate(name) {
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  $$(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  ({ upload: () => {}, results: () => loadSub[curSub](), zoho: loadPay, razorpay: loadZoho,
     kotak: () => loadRaw("kotak"), cashfree: () => loadRaw("cashfree"),
     icici: () => loadRaw("icici"), hdfc: () => loadRaw("hdfc") })[name]();
}
$$(".tab").forEach(t => t.onclick = () => activate(t.dataset.tab));
function reloadAll() { const a = $(".tab.active").dataset.tab; activate(a); }

/* ---------------- generic table + pager ---------------- */
function pager(el, state, total, load) {
  const pages = Math.max(1, Math.ceil(total / PAGE)), from = total ? (state.page - 1) * PAGE + 1 : 0, to = Math.min(total, state.page * PAGE);
  el.innerHTML = `<button ${state.page <= 1 ? "disabled" : ""} data-d="-1">&larr; Prev</button>
    <span>${from.toLocaleString()}&ndash;${to.toLocaleString()} of ${total.toLocaleString()} &middot; page ${state.page} / ${pages}</span>
    <button ${state.page >= pages ? "disabled" : ""} data-d="1">Next &rarr;</button>`;
  $$("button", el).forEach(b => b.onclick = () => { state.page += +b.dataset.d; load(); });
}
function plainTable(el, cols, rows) {
  if (!cols.length) { el.innerHTML = `<div class="empty">No data yet - upload the sheet above.</div>`; return; }
  if (!rows.length) { el.innerHTML = `<div class="empty">No rows match these filters.</div>`; return; }
  el.innerHTML = `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${r.map(v => `<td title="${esc(v)}">${esc(v)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
}
function setOptions(sel, values, keepFirst = true) {
  const cur = sel.value; sel.innerHTML = (keepFirst ? `<option value="">All</option>` : "") + values.map(v => `<option>${esc(v)}</option>`).join(""); sel.value = cur;
}
const dateOk = (el, re) => { const ok = !el.value || re.test(el.value.trim()); el.classList.toggle("bad", !ok); return ok; };
const RE_ISO = /^\d{4}-\d{2}-\d{2}$/, RE_DMY = /^\d{2}\/\d{2}\/\d{4}$/;

/* ---------------- Payments tab ---------------- */
const pState = { page: 1 };
async function loadPay() {
  $("#p-err").textContent = "";
  if (!dateOk($("#p-from"), RE_ISO) | !dateOk($("#p-to"), RE_ISO)) { $("#p-err").textContent = "Dates must be in yyyy-mm-dd format, same as the sheet."; return; }
  try {
    const d = await api("/api/payments?" + qs({ mode: $("#p-mode").value, deposit_to: $("#p-dep").value, currency: $("#p-currency").value, date_from: $("#p-from").value.trim(), date_to: $("#p-to").value.trim(), page: pState.page, page_size: PAGE }));
    setOptions($("#p-mode"), d.modes); setOptions($("#p-dep"), d.deposit_tos); setOptions($("#p-currency"), d.currencies);
    plainTable($("#p-table"), d.columns, d.rows); pager($("#p-pager"), pState, d.total, loadPay);
  } catch (e) { $("#p-err").textContent = e.message; }
}
const pApply = () => { pState.page = 1; loadPay(); };
$("#p-apply").onclick = pApply; $("#p-mode").onchange = pApply; $("#p-dep").onchange = pApply; $("#p-currency").onchange = pApply;
$$("#p-from,#p-to").forEach(i => i.onkeydown = e => e.key === "Enter" && pApply());
$("#p-reset").onclick = () => { ["#p-mode", "#p-dep", "#p-currency", "#p-from", "#p-to"].forEach(s => $(s).value = ""); pApply(); };

/* ---------------- Zoho tab ---------------- */
const zState = { page: 1 };
async function loadZoho() {
  $("#z-err").textContent = "";
  if (!dateOk($("#z-from"), RE_DMY) | !dateOk($("#z-to"), RE_DMY)) { $("#z-err").textContent = "Dates must be in dd/mm/yyyy format, same as the sheet."; return; }
  try {
    const d = await api("/api/zoho?" + qs({ method: $("#z-method").value, currency: $("#z-currency").value, date_from: $("#z-from").value.trim(), date_to: $("#z-to").value.trim(), page: zState.page, page_size: PAGE }));
    setOptions($("#z-method"), d.methods); setOptions($("#z-currency"), d.currencies);
    plainTable($("#z-table"), d.columns, d.rows); pager($("#z-pager"), zState, d.total, loadZoho);
  } catch (e) { $("#z-err").textContent = e.message; }
}
const zApply = () => { zState.page = 1; loadZoho(); };
$("#z-apply").onclick = zApply; $("#z-method").onchange = zApply; $("#z-currency").onchange = zApply;
$$("#z-from,#z-to").forEach(i => i.onkeydown = e => e.key === "Enter" && zApply());
$("#z-reset").onclick = () => { ["#z-method", "#z-currency", "#z-from", "#z-to"].forEach(s => $(s).value = ""); zApply(); };

/* ---------------- Match / Mismatch tab ---------------- */
const mState = { page: 1, result: "All", status: null, currency: "", q: "" };
let agentList = [];
async function loadMatches() {
  const d = await api("/api/matches?" + qs({ result: mState.result, status: mState.status ?? "captured", currency: mState.currency, q: mState.q, page: mState.page, page_size: PAGE }));
  agentList = d.agents || [];
  // status dropdown (default: captured - failed attempts never reach Zoho, so they are noise here)
  const sel = $("#m-status");
  if (mState.status === null && d.statuses.length) mState.status = d.statuses.includes("captured") ? "captured" : "All";
  sel.innerHTML = `<option value="All">All statuses</option>` + d.statuses.map(s => `<option>${esc(s)}</option>`).join("");
  sel.value = mState.status ?? "captured";
  setOptions($("#m-currency"), d.currencies || []);
  $("#chips").innerHTML = ["All", "Matched", "Mismatched", "Missing"].map(r =>
    `<button class="chip ${mState.result === r ? "active" : ""}" data-r="${r}">${r} (${(d.counts[r] || 0).toLocaleString()})</button>`).join("");
  $$("#chips .chip").forEach(b => b.onclick = () => { mState.result = b.dataset.r; mState.page = 1; loadMatches(); });

  const el = $("#m-table");
  if (!d.counts.All && !mState.q && !mState.currency) {
    el.innerHTML = `<div class="empty">No results yet - upload both sheets and click <b>Match</b>.</div>`; $("#m-pager").innerHTML = ""; return;
  }
  const head = ["Result", "Matched By", "Agent", "Remarks", "Payment Amount", "Fees", "Amount (INR)", "Difference", "Amount Basis"];
  const agentOpts = cur => ["Unassigned", ...new Set([...agentList, ...(cur ? [cur] : [])])].map(a => `<option ${a === (cur || "Unassigned") ? "selected" : ""}>${esc(a)}</option>`).join("");
  el.innerHTML = `<div class="tablewrap"><table><thead><tr>
      <th class="added">Invoice Number</th>
      ${d.columns.map((c, i) => `<th class="${i === d.rate_col || i === d.paid_col ? "added" : ""}">${esc(c)}</th>`).join("")}${head.map((h, i) => `<th class="${i === 2 || i === 3 ? "added" : ""}">${h}</th>`).join("")}</tr></thead><tbody>` +
    d.rows.map(r => {
      const needsAgent = r.result !== "Matched";
      const dcls = r.difference == null || Math.abs(r.difference) < 0.005 ? "" : r.difference > 0 ? "diffpos" : "diffneg";
      return `<tr data-id="${esc(r.id)}">
        <td title="${esc(r.invoice_number)}">${esc(r.invoice_number) || "&mdash;"}</td>
        ${r.cells.map((v, i) => i === d.rate_col ? `<td class="num" title="${esc(v)}">${v == null ? "&mdash;" : esc(rate(v))}</td>` : `<td title="${esc(v)}">${esc(v)}</td>`).join("")}
        <td><span class="badge b-${r.result}">${r.result}</span></td>
        <td>${esc(r.matched_by)}</td>
        <td>${needsAgent ? `<select class="agent">${agentOpts(r.agent)}</select>` : "&mdash;"}</td>
        <td><input class="remarks" placeholder="Add remark..." value="${esc(r.remarks)}"></td>
        <td class="num">${money(r.payment_amount)}</td><td class="num">${r.fee == null ? "&mdash;" : money(r.fee)}</td><td class="num">${r.amount_inr == null ? "&mdash;" : money(r.amount_inr)}</td><td class="num ${dcls}">${money(r.difference)}</td><td>${esc(r.basis)}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  if (!d.rows.length) el.innerHTML = `<div class="empty">No rows for this filter.</div>`;
  pager($("#m-pager"), mState, d.total, loadMatches);
}
async function saveAnnotation(td, body) {
  try { await api("/api/annotation", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); td.classList.add("saved"); setTimeout(() => td.classList.remove("saved"), 1200); }
  catch (e) { alert("Could not save: " + e.message); }
}
$("#m-table").addEventListener("change", e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  if (e.target.matches("select.agent")) saveAnnotation(e.target.parentElement, { zoho_id: tr.dataset.id, agent: e.target.value });
  if (e.target.matches("input.remarks")) saveAnnotation(e.target.parentElement, { zoho_id: tr.dataset.id, remarks: e.target.value });
});
$("#download-current-view").onclick = () => {
  const result = mState.result === "All" ? "All" : mState.result;
  window.location = "/api/matches/export?" + qs({ result, status: mState.status ?? "captured", currency: mState.currency });
};
$("#m-currency").onchange = e => { mState.currency = e.target.value; mState.page = 1; loadMatches(); };
$("#m-status").onchange = e => { mState.status = e.target.value; mState.page = 1; loadMatches(); };
let qTimer; $("#m-q").oninput = e => { clearTimeout(qTimer); qTimer = setTimeout(() => { mState.q = e.target.value; mState.page = 1; loadMatches(); }, 300); };

/* ---------------- Match / Mismatch sub tabs ---------------- */
const loadSub = { razorpay: () => loadMatches(), kotak: () => loadSrcMatch("kotak"), cashfree: () => loadSrcMatch("cashfree"),
                  icici: () => loadSrcMatch("icici"), hdfc: () => loadSrcMatch("hdfc") };
let curSub = "razorpay";
$$(".subtab").forEach(b => b.onclick = () => {
  curSub = b.dataset.sub;
  $$(".subtab").forEach(x => x.classList.toggle("active", x === b));
  $$(".subpanel").forEach(p => p.classList.toggle("active", p.id === "sub-" + curSub));
  loadSub[curSub]();
});

/* ---------------- Kotak / Cash Free / ICICI / HDFC / Kotak Statement: match tables + original tables (one generic implementation) ---------------- */
/* To add a sheet here: one entry in SRC (label + the search box hint), plus its tab / sub tab / panel in the HTML above. */
const SRC = {
  kotak: { label: "Kotak", search: "ref no. / description" },
  cashfree: { label: "Cash Free", search: "order id / reference id" },
  icici: { label: "ICICI", search: "tran. id / remarks" },
  hdfc: { label: "HDFC", search: "ref no. / narration" },
};
const filterSelects = (filters, state) => (filters || []).map(f =>
  `<label>${esc(f.label)}<select data-param="${esc(f.param)}"><option value="All">All</option>${f.options.map(o => `<option ${o === (state[f.param] ?? f.value) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`).join("");
const MATCH_HEAD = ["Result", "Matched By", "Agent", "Remarks", "Payment Amount", "Difference", "Amount Basis"];

const srcMatch = {};
for (const src of Object.keys(SRC)) {
  srcMatch[src] = { page: 1, result: "All", filters: null, q: "" };
  $("#sub-" + src).innerHTML = `
    <div class="filters">
      <div class="chips"></div>
      <span class="selwrap"></span>
      <label>Search<input class="s-q" placeholder="${esc(SRC[src].search)}"></label>
    </div>
    <div class="filters dl"><span class="meta">Download Excel:</span>
      <button data-dl="All">All tables (3 sheets)</button><button data-dl="Matched">Matched</button>
      <button data-dl="Mismatched">Mismatched</button><button data-dl="Missing">Missing</button>
      <button class="danger" data-clear="matches:${src}">Clear data</button></div>
    <div class="s-table"></div><div class="pager"></div>`;
}
const srcParams = st => ({ ...(st.filters || {}), q: st.q });
async function loadSrcMatch(src) {
  const st = srcMatch[src], root = $("#sub-" + src);
  const d = await api(`/api/recon/${src}/matches?` + qs({ result: st.result, page: st.page, page_size: PAGE, defaults: st.filters === null ? 1 : "", ...srcParams(st) }));
  if (st.filters === null) st.filters = Object.fromEntries((d.filters || []).map(f => [f.param, f.value]));  // first load: the defaults the server picked
  $(".selwrap", root).innerHTML = filterSelects(d.filters, st.filters);
  $(".chips", root).innerHTML = ["All", "Matched", "Mismatched", "Missing"].map(r =>
    `<button class="chip ${st.result === r ? "active" : ""}" data-r="${r}">${r} (${((d.counts || {})[r] || 0).toLocaleString()})</button>`).join("");
  const el = $(".s-table", root), pg = $(".pager", root);
  if (!d.columns.length) {
    el.innerHTML = `<div class="empty">${d.has_sheet ? `No results yet - click <b>Match</b>.` : `No ${SRC[src].label} sheet yet - upload it above, then click <b>Match</b>.`}</div>`; pg.innerHTML = ""; return;
  }
  if (!d.rows.length) { el.innerHTML = `<div class="empty">No rows for this filter.</div>`; pager(pg, st, d.total, () => loadSrcMatch(src)); return; }
  const agentOpts = cur => ["Unassigned", ...new Set([...(d.agents || []), ...(cur ? [cur] : [])])].map(a => `<option ${a === (cur || "Unassigned") ? "selected" : ""}>${esc(a)}</option>`).join("");
  el.innerHTML = `<div class="tablewrap"><table><thead><tr><th class="added">Invoice Number</th>${d.columns.map(c => `<th>${esc(c)}</th>`).join("")}` +
    MATCH_HEAD.map((h, i) => `<th class="${i === 2 || i === 3 ? "added" : ""}">${h}</th>`).join("") + `</tr></thead><tbody>` +
    d.rows.map(r => {
      const dcls = r.difference == null || Math.abs(r.difference) < 0.005 ? "" : r.difference > 0 ? "diffpos" : "diffneg";
      return `<tr data-id="${esc(r.id)}"><td title="${esc(r.invoice_number)}">${esc(r.invoice_number) || "&mdash;"}</td>` +
        r.cells.map(v => `<td title="${esc(v)}">${esc(v)}</td>`).join("") +
        `<td><span class="badge b-${r.result}">${r.result}</span></td><td>${esc(r.matched_by)}</td>` +
        `<td>${r.result !== "Matched" ? `<select class="agent">${agentOpts(r.agent)}</select>` : "&mdash;"}</td>` +
        `<td><input class="remarks" placeholder="Add remark..." value="${esc(r.remarks)}"></td>` +
        `<td class="num">${r.payment_amount == null ? "&mdash;" : money(r.payment_amount)}</td><td class="num ${dcls}">${r.difference == null ? "&mdash;" : money(r.difference)}</td><td>${esc(r.basis)}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  pager(pg, st, d.total, () => loadSrcMatch(src));
}
for (const src of Object.keys(SRC)) {
  const st = srcMatch[src], root = $("#sub-" + src), reload = () => { st.page = 1; loadSrcMatch(src); };
  root.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { st.result = b.dataset.r; reload(); } });
  root.addEventListener("change", e => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) {  // agent / remarks of a row
      if (e.target.matches("select.agent")) saveAnnotation(e.target.parentElement, { zoho_id: tr.dataset.id, agent: e.target.value });
      if (e.target.matches("input.remarks")) saveAnnotation(e.target.parentElement, { zoho_id: tr.dataset.id, remarks: e.target.value });
    } else if (e.target.matches("select[data-param]")) { st.filters[e.target.dataset.param] = e.target.value; reload(); }
  });
  let t; $(".s-q", root).oninput = e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; reload(); }, 300); };
  $$("[data-dl]", root).forEach(b => b.onclick = () => { window.location = `/api/recon/${src}/export?` + qs({ result: b.dataset.dl, ...srcParams(st) }); });
}

/* original tables of the Kotak / Cash Free / ICICI / HDFC / Kotak Statement sheets (main tabs) */
const rawState = {};
for (const src of Object.keys(SRC)) {
  rawState[src] = { page: 1, filters: {} };
  $("#panel-" + src).innerHTML = `
    <div class="filters">
      <span class="selwrap"></span>
      <label>Date from (dd-mm-yyyy) <input class="date r-from" placeholder="dd-mm-yyyy" maxlength="10"></label>
      <label>Date to (dd-mm-yyyy) <input class="date r-to" placeholder="dd-mm-yyyy" maxlength="10"></label>
      <button class="r-apply">Apply</button><button class="r-reset">Reset</button>
      <button class="danger" data-clear="sheet:${src}">Clear data</button>
    </div>
    <div class="err-line"></div><div class="r-table"></div><div class="pager"></div>`;
}
const RE_DMY_DASH = /^\d{2}-\d{2}-\d{4}$/;
async function loadRaw(src) {
  const st = rawState[src], root = $("#panel-" + src), err = $(".err-line", root), from = $(".r-from", root), to = $(".r-to", root);
  err.textContent = "";
  if (!dateOk(from, RE_DMY_DASH) | !dateOk(to, RE_DMY_DASH)) { err.textContent = "Dates must be in dd-mm-yyyy format, same as the sheet."; return; }
  try {
    const d = await api(`/api/sheet/${src}?` + qs({ ...st.filters, date_from: from.value.trim(), date_to: to.value.trim(), page: st.page, page_size: PAGE }));
    $(".selwrap", root).innerHTML = filterSelects(d.filters, st.filters);
    plainTable($(".r-table", root), d.columns, d.rows); pager($(".pager", root), st, d.total, () => loadRaw(src));
  } catch (e) { err.textContent = e.message; }
}
for (const src of Object.keys(SRC)) {
  const st = rawState[src], root = $("#panel-" + src), apply = () => { st.page = 1; loadRaw(src); };
  root.addEventListener("change", e => { if (e.target.matches("select[data-param]")) { st.filters[e.target.dataset.param] = e.target.value; apply(); } });
  $(".r-apply", root).onclick = apply;
  $$(".r-from,.r-to", root).forEach(i => i.onkeydown = e => e.key === "Enter" && apply());
  $(".r-reset", root).onclick = () => { st.filters = {}; $(".r-from", root).value = ""; $(".r-to", root).value = ""; apply(); };
}

/* ---------------- Clear data buttons (one per tab / sub tab) ---------------- */
const SHEET_NAME = { payments: "Zoho", zoho: "Razorpay", kotak: "Kotak", cashfree: "Cash Free", icici: "ICICI", hdfc: "HDFC" };
const MATCH_NAME = { razorpay: "Razorpay", kotak: "Kotak", cashfree: "Cash Free", icici: "ICICI", hdfc: "HDFC" };
function clearTarget(spec) {  // "sheet:<kind>" or "matches:<source>"
  const [type, id] = spec.split(":");
  if (type === "matches") return { url: "/api/clear/matches/" + id, text:
    `Clear the ${MATCH_NAME[id]} match results?\n\nThis deletes the ${MATCH_NAME[id]} Match / Mismatch table and the agent / remarks entered on it. The uploaded ${MATCH_NAME[id]} sheet stays - click Match to build it again.\n\nThis cannot be undone.` };
  return { url: "/api/clear/sheet/" + id, text: id === "payments"
    ? `Clear the Zoho sheet?\n\nThis permanently deletes all Zoho (customer payment) rows from the database and empties every Match / Mismatch table, because they were computed against it. Upload the Zoho sheet again and click Match to rebuild.\n\nThis cannot be undone.`
    : `Clear the ${SHEET_NAME[id]} sheet?\n\nThis permanently deletes all uploaded ${SHEET_NAME[id]} rows from the database, together with its Match / Mismatch table and the agent / remarks entered on it.\n\nThis cannot be undone.` };
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-clear]");
  if (!b) return;
  const t = clearTarget(b.dataset.clear);
  if (!confirm(t.text)) return;
  b.disabled = true;
  try {
    await api(t.url, { method: "POST" });
    if (b.dataset.clear.startsWith("sheet:")) document.dispatchEvent(new CustomEvent("sheet-cleared", { detail: b.dataset.clear.slice(6) }));
    // back to a fresh state: page 1, default filters, empty search / date boxes
    Object.assign(mState, { page: 1, result: "All", status: null, currency: "", q: "" }); $("#m-q").value = "";
    for (const src of Object.keys(SRC)) { Object.assign(srcMatch[src], { page: 1, result: "All", filters: null, q: "" }); $(".s-q", $("#sub-" + src)).value = ""; }
    pState.page = 1; zState.page = 1;
    $("#p-reset").click(); $("#z-reset").click(); $$(".r-reset").forEach(x => x.click());
    await refreshStatus(); reloadAll();
  } catch (err) { alert("Could not clear the data: " + err.message); }
  b.disabled = false;
});

/* ---------------- boot ---------------- */
(async () => { await refreshStatus(); loadMatches(); })();
</script>
</body>
</html>
